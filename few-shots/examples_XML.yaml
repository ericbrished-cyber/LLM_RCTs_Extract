            <th align="left" valign="bottom">&#160;<hr/></th>
            <th colspan="2" align="center" valign="bottom"><bold>Yoga group</bold><hr/></th>
            <th colspan="2" align="center" valign="bottom"><bold>Control group</bold><hr/></th>
            <th align="center" valign="top"><bold>Effect size</bold></th>
            <th align="center" valign="top"><bold>p</bold><sup><bold>*</bold></sup></th>
          </tr>
          <tr>
            <th align="left"><bold>Outcome measure</bold></th>
            <th align="center"><bold>Week 0</bold></th>
            <th align="center"><bold>Week 11</bold></th>
            <th align="center"><bold>Week 0</bold></th>
            <th align="center"><bold>Week 11</bold></th>
          </tr>
        </thead>
        <tbody valign="top">
          <tr>
            <td><bold><italic toggle="yes">HRV and Heart Rate</italic></bold><hr/></td>
          </tr>
          <tr>
            <td>&#8195;Log HF Power<hr/></td>
            <td align="center">2.75&#8201;&#177;&#8201;0.63<hr/></td>   <!-- Yoga, Week 0 -->
            <td align="center">2.51&#8201;&#177;&#8201;0.83<hr/></td>   <!-- Yoga, Week 11 -->
            <td align="center">2.57&#8201;&#177;&#8201;0.58<hr/></td>   <!-- Control, Week 0 -->
            <td align="center">2.53&#8201;&#177;&#8201;0.55<hr/></td>   <!-- Control, Week 11 -->
            <td align="center">0.02<hr/></td>
            <td align="center">0.48<hr/></td>
          </tr>
          <tr>
            <td>&#8195;pNN50<hr/></td>
            <td align="center">27.7&#8201;&#177;&#8201;27.5<hr/></td>   <!-- Yoga, Week 0 -->
            <td align="center">20.7&#8201;&#177;&#8201;25.3<hr/></td>   <!-- Yoga, Week 11 -->
            <td align="center">16.0&#8201;&#177;&#8201;16.6<hr/></td>   <!-- Control, Week 0 -->
            <td align="center">19.4&#8201;&#177;&#8201;18.4<hr/></td>   <!-- Control, Week 11 -->
            <td align="center">0.12<hr/></td>
            <td align="center">0.04<hr/></td>
          </tr>
          <tr>
            <td><bold><italic toggle="yes">Musculoskeletal Fitness</italic></bold><hr/></td>
          </tr>
          <tr>
            <td>&#8195;Sit and reach (cm)<hr/></td>
            <td align="center">27.8&#8201;&#177;&#8201;10.0<hr/></td>   <!-- Yoga, Week 0 -->

            <td align="center">26.4&#8201;&#177;&#8201;10.4<hr/></td>   <!-- Control, Week 11 -->
            <td align="center">0.35<hr/></td>
            <td align="center">&lt;0.001<hr/></td>
          </tr>
        </tbody>
      </table>
    </table-wrap>

